name: wilapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.1.0
  image_picker: ^1.1.2
  crypto: ^3.0.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/willLOGO.png"
  min_sdk_android: 21
  # Uses your solid background image instead of hex color to prevent white borders:
  adaptive_icon_background: "assets/icons/willLOGO.png"
  adaptive_icon_foreground: "assets/icons/app_icon_nobg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/